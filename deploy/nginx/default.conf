upstream pas_backend {
    server web:8005;
}

server {
    listen 80;
    server_name _;

    # Batasi ukuran upload dokumen (mis. 10 MB)
    client_max_body_size 10m;

    # Static (hasil collectstatic)
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Media (dokumen sensitif — perlu diproteksi lebih lanjut di aplikasi)
    location /media/ {
        alias /app/media/;
        expires 7d;
    }

    # Proxy ke Gunicorn
    location / {
        proxy_pass http://pas_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_redirect off;
    }

    # Webhook payment: jangan timeout pendek
    location /pembayaran/webhook/ {
        proxy_pass http://pas_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }
}
