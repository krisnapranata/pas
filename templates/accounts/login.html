{% extends "base.html" %}

{% block title %}Login - PAS Bandara{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h4 class="card-title text-center mb-1">PAS Bandara</h4>
                <p class="text-muted text-center mb-4">Sistem Manajemen Permintaan PAS</p>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary w-100">Masuk</button>
                </form>
                <hr>
                <p class="text-center mb-0 small">
                    Belum punya akun? <a href="{% url 'accounts:register' %}">Daftar</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
