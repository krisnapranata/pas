{% extends "base.html" %}

{% block title %}Daftar - PAS Bandara{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h4 class="card-title text-center mb-4">Registrasi Pemohon</h4>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary w-100">Daftar</button>
                </form>
                <hr>
                <p class="text-center mb-0 small">
                    Sudah punya akun? <a href="{% url 'accounts:login' %}">Masuk</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
