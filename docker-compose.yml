# ============================================================
# PAS Bandara — Production stack
# Service: web (Django+Gunicorn), nginx, db (MariaDB), redis, backup
#
# Jalankan dengan:
#   docker compose --env-file .env.production up -d --build
# (--env-file dipakai agar interpolasi ${DB_*}, ${BACKUP_*} membaca
#  file yang sama dengan env_file service, bukan .env development)
# ============================================================

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      MARIADB_DATABASE: ${DB_NAME:-pas_bandara}
      MARIADB_USER: ${DB_USER:-pas_user}
      MARIADB_PASSWORD: ${DB_PASSWORD:-change-me}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change-me-root}
      TZ: Asia/Jakarta
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_ENV: production
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    expose:
      - "8005"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
    # Tidak publish 80/443 — akses via nginx-proxy-manager (network `proxy_default`)
    expose:
      - "80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
    networks:
      - default
      - proxy

  backup:
    build:
      context: .
      dockerfile: deploy/backup.Dockerfile
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - .env.production
    environment:
      DB_HOST: db
      BACKUP_RETAIN_DAYS: ${BACKUP_RETAIN_DAYS:-14}
    volumes:
      - media_data:/media:ro
      - backup_data:/backup
    # Cron default 02:00 setiap hari; override via BACKUP_CRON di .env.production
    entrypoint: /bin/sh -c
    command:
      - 'echo "${BACKUP_CRON:-0 2 * * *} /usr/local/bin/backup.sh >> /backup/backup.log 2>&1" > /etc/crontabs/root && exec crond -f -l 2'

volumes:
  db_data:
  redis_data:
  media_data:
  static_data:
  backup_data:

networks:
  proxy:
    external: true
    name: proxy_default
